name: Tests

# Runs the pytest unit suite on every PR and on pushes to main.
# See pytest.ini for collection + Project/tests/unit/ for the actual tests.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install apt-provided Python deps (mirrors --system-site-packages on the Pi)
        run: |
          # Same packages the Pi installer pulls via apt and exposes through
          # --system-site-packages. Keeping CI on apt (not pip) matches the
          # device install path, so "works in CI, broken on Pi" can't happen
          # via a pandas/numpy/PyQt5 ABI skew. python3-numpy is a transitive
          # dep of python3-pandas, so apt resolves it automatically.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pyqt5 python3-pandas

      - name: Install pinned Python deps + dev deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install -r requirements-dev.txt

      - name: Lint (ruff) — format + full configured ruleset
        run: |
          # The incremental adoption is complete: every family in
          # ruff.toml's `select` (I, F401, F811, F841) is now clean, so CI
          # enforces the full configured ruleset via a bare `ruff check`.
          ruff format --check .
          ruff check .

      - name: Run pytest
        run: python3 -m pytest

  unit-bookworm:
    # The devices run Raspberry Pi OS Bookworm: Python 3.11 from apt, PyQt5
    # and pandas from apt, and a venv built with --system-site-packages
    # (scripts/install/10-apt.sh, 30-python.sh). The job above runs on the
    # runner's newer Python, so code that only works there (3.12 f-string
    # forms, newer stdlib behaviour) would pass CI and fail on a Pi. This job
    # rebuilds the device's stack in a Debian Bookworm container and runs the
    # same suite on it.
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install the device's apt stack
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ca-certificates git python3 python3-venv python3-pip python3-pyqt5 python3-pandas

      - uses: actions/checkout@v4

      - name: Build the venv the way the installer does
        run: |
          python3 -m venv --system-site-packages /opt/rrr-venv
          /opt/rrr-venv/bin/python -m pip install -q --upgrade pip
          /opt/rrr-venv/bin/python -m pip install -q -r requirements.txt -r requirements-dev.txt

      - name: Run pytest on the device's Python
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /opt/rrr-venv/bin/python --version
          /opt/rrr-venv/bin/python -m pytest
